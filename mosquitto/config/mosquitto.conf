# Mosquitto 配置（四期：dynsec 动态安全插件，文件式 passwd/ACL 退役）
# ⚠ TLS 证书仍需先跑 scripts/setup-broker-security.ps1 生成 mosquitto/certs/*
# 用户/ACL 改由 hub 经 $CONTROL/dynamic-security/v1 运行时管理（控制台账号体系）

per_listener_settings false
allow_anonymous false

# 明文 MQTT（内网/调试）
listener 1883

# WebSocket
listener 9001
protocol websockets

# TLS（自签证书）
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# dynamic security 插件（运行时管理用户/ACL）
# 实测 eclipse-mosquitto:2（mosquitto 2.1.2）插件在 /usr/lib/ 下；
# 启动失败时先验证：docker exec mqtt-broker sh -c "find / -name '*dynamic_security*.so'"
plugin /usr/lib/mosquitto_dynamic_security.so
# 实测 2.1.2 选项名为 config_file（旧文档的 db_file 已不被识别）
plugin_opt_config_file /mosquitto/data/dynsec.json

# 持久化与日志
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type all
