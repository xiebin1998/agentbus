# Mosquitto 配置（TASK-25 安全基线：匿名被拒 + 密码认证 + TLS）
# ⚠ 首次启动前先运行 scripts/setup-broker-security.ps1 生成
#   mosquitto/config/passwd 与 mosquitto/certs/*，否则容器因缺文件启动失败。

# 明文 MQTT（1883）：仍保留（内网/调试），但强制密码认证
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

# WebSocket（9001）：同样强制密码认证
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd

# TLS（8883）：自签证书由 setup 脚本生成；CN=localhost 含 SAN 127.0.0.1
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
allow_anonymous false
password_file /mosquitto/config/passwd

# 持久化
persistence true
persistence_location /mosquitto/data/

# 日志
log_dest file /mosquitto/log/mosquitto.log
log_type all
