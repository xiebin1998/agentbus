services:
  # MQTT Broker
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "18830:1883"     # MQTT (改用 18830 避免冲突)
      - "9001:9001"      # WebSocket
    volumes:
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
      - ./mosquitto/config:/mosquitto/config
    networks:
      - mcp-network

  # AgentBus Hub（MCP ↔ MQTT 中枢）
  agentbus-hub:
    build: .
    container_name: agentbus-hub
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_USE_TLS=${MQTT_USE_TLS:-false}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    depends_on:
      - mqtt-broker
    networks:
      - mcp-network

volumes:
  mqtt-data:
  mqtt-log:

networks:
  mcp-network:
    driver: bridge
